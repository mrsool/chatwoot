name: Build Taxi Fazaa Production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: taxi-fazaa-production-build
  cancel-in-progress: false

env:
  IMAGE: me-central2-docker.pkg.dev/rh-production/fazaa-chatwoot/fazaa-chatwoot
  IMAGE_TAG: taxi-${{ github.sha }}-${{ github.run_id }}
  WIF_PROVIDER: projects/549898665457/locations/global/workloadIdentityPools/fazaa-chatwoot-ci/providers/github
  GCP_SERVICE_ACCOUNT: fazaa-chatwoot-ci@rh-production.iam.gserviceaccount.com

jobs:
  verify-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Verify develop branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/develop" ]]; then
            echo "::error::Only develop is authorized for production GCP builds"
            exit 1
          fi

  build:
    needs: verify-branch
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4

      - name: Prepare Enterprise Dockerfile
        shell: bash
        run: |
          set -euo pipefail

          test -d enterprise
          test -f docker/Dockerfile

          grep -qF '# Precompress JS/CSS assets' docker/Dockerfile || {
            echo "::error::Expected Gzip Dockerfile changes are missing"
            exit 1
          }

          cp docker/Dockerfile "$RUNNER_TEMP/taxi-Dockerfile"

          printf '\nENV CW_EDITION="ee"\n' \
            >> "$RUNNER_TEMP/taxi-Dockerfile"

          echo "Source SHA: $(git rev-parse HEAD)"
          echo "Enterprise and Gzip configuration verified"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          create_credentials_file: false
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Login to GCP Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: me-central2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/taxi-Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=taxi-fazaa-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=taxi-fazaa-${{ matrix.arch }}

  publish:
    name: Publish multi-arch image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          create_credentials_file: false
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: me-central2-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${IMAGE}:${IMAGE_TAG}" \
            "${IMAGE}:${IMAGE_TAG}-amd64" \
            "${IMAGE}:${IMAGE_TAG}-arm64"

          DIGEST="$(
            docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" |
            awk '$1 == "Digest:" {print $2; exit}'
          )"

          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::Unable to determine image digest"
            exit 1
          }

          {
            echo "### Taxi Fazaa Chatwoot Production"
            echo
            echo "- Source SHA: \`${GITHUB_SHA}\`"
            echo "- Edition: Enterprise"
            echo "- Image: \`${IMAGE}:${IMAGE_TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Published: ${IMAGE}:${IMAGE_TAG}"
          echo "Digest: ${DIGEST}"
