name: Prepare Fazaa Chatwoot Production Deployment PR (AWS)

# This workflow DOES NOT deploy into Kubernetes. It opens a reviewed app_charts PR.
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Already-built ECR version tag, e.g. v1.0.0'
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: fazaa-chatwoot-production-deploy-pr
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  AWS_ACCOUNT_ID: '634622424283'
  ECR_REPOSITORY: fazaa-chatwoot
  RELEASE_TAG: ${{ inputs.version_tag }}
  CHART_VALUES: fazaa-chatwoot/ci/production-values.yaml

jobs:
  update-chart:
    name: Verify release and open production deployment PR
    runs-on: ubuntu-latest
    steps:
      - name: Require develop dispatch and valid version tag
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/develop' || {
            echo "::error::Run this workflow from develop"
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected vMAJOR.MINOR.PATCH, got $RELEASE_TAG"
            exit 1
          }

      - name: Configure AWS production credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::634622424283:role/github-stsassume
          role-session-name: fazaa-chatwoot-prod-build
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify exact production ECR image and digest
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || {
            echo "::error::Wrong AWS account: $ACCOUNT"
            exit 1
          }
          DETAILS="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$RELEASE_TAG" \
            --query 'imageDetails[0].{digest:imageDigest,media:imageManifestMediaType}' \
            --output json)"
          DIGEST="$(jq -r '.digest' <<< "$DETAILS")"
          MEDIA="$(jq -r '.media' <<< "$DETAILS")"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::ECR image digest not found"
            exit 1
          }
          case "$MEDIA" in
            application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json) ;;
            *) echo "::error::Expected multi-arch index, got $MEDIA"; exit 1 ;;
          esac
          echo "RELEASE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "Verified ${ECR_REPOSITORY}:${RELEASE_TAG}@${DIGEST}"

      - name: Checkout app_charts master
        uses: actions/checkout@v4
        with:
          repository: mrsool/app_charts
          ref: master
          token: ${{ secrets.DEVOPS_ACCOUNT_REPO_ACCESS_TOKEN }}
          path: app_charts
          persist-credentials: true

      - name: Update only the production image tag and digest
        working-directory: app_charts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
