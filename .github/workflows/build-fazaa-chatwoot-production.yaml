name: Build Fazaa Chatwoot Production Image (AWS)

run-name: "PROD Build | ${{ inputs.version_tag || github.ref_name }}"

# A version tag starts a production IMAGE build, not a production deployment.
# Manual runs are supported for recovery and must specify an existing vX.Y.Z tag.
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Existing Git version tag, e.g. v1.0.0'
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: fazaa-chatwoot-production-build-${{ inputs.version_tag || github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  AWS_ACCOUNT_ID: '634622424283'
  ECR_REPOSITORY: fazaa-chatwoot
  RELEASE_TAG: ${{ inputs.version_tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected existing version tag vMAJOR.MINOR.PATCH, got: $RELEASE_TAG"
            exit 1
          }

      - name: Checkout tagged Chatwoot source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify release source and enterprise/gzip build
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$(git rev-parse HEAD)" = "$TAG_SHA"
          git merge-base --is-ancestor HEAD origin/develop || {
            echo "::error::Release tag must point to a commit already on develop"
            exit 1
          }
          test -d enterprise || {
            echo "::error::Enterprise source directory missing"
            exit 1
          }
          grep -qF '# Precompress JS/CSS assets' docker/Dockerfile || {
            echo "::error::Tagged Dockerfile is missing the staging-tested gzip change. Do not release a different build."
            exit 1
          }
          if ! grep -Eq '^[[:space:]]*ENV[[:space:]]+CW_EDITION[=[:space:]]' docker/Dockerfile; then
            printf '\nENV CW_EDITION="ee"\n' >> docker/Dockerfile
          fi
          echo "Release: $RELEASE_TAG | Source: $TAG_SHA | Arch: ${{ matrix.arch }}"

      - name: Configure AWS production credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::634622424283:role/github-stsassume
          role-session-name: fazaa-chatwoot-prod-build
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "$ACCOUNT" = "$AWS_ACCOUNT_ID" || {
            echo "::error::Wrong AWS account $ACCOUNT (expected $AWS_ACCOUNT_ID)"
            exit 1
